<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Unified FPS - автономный браузерный прототип</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Three.js из CDN -->
  <script src="https://unpkg.com/three@0.152.0/build/three.min.js"></script>
  <!-- Встроенные стили UI -->
  <style>
    :root {
      --bg: #0b0f1a;
      --panel: rgba(15, 15, 20, 0.85);
      --text: #e8e8e8;
      --muted: #a0a0a0;
    }
    html, body { height: 100%; margin: 0; background: #000; color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto; }
    #sceneContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* Лобби UI */
    #lobby {
      position: fixed; left: 20px; top: 20px;
      width: 320px; padding: 14px;
      background: rgba(10,10,15,0.85);
      border: 1px solid #333;
      border-radius: 8px;
      z-index: 10;
    }
    #lobby h2 { margin: 0 0 8px 0; font-size: 18px; }
    #lobby label { display: block; margin-top: 8px; color: #ddd; font-size: 12px; }
    #lobby select, #lobby button, #lobby input[type="range"] {
      width: 100%; padding: 8px; margin-top: 6px; border-radius: 6px; border: 1px solid #555; background: #111;
      color: #ddd;
    }
    #lobby .row { display: flex; gap: 6px; }
    #lobby .row button { flex: 1; }

    /* Настройки отдельные панельки (пример) */
    #settings {
      position: fixed; right: 20px; top: 20px;
      width: 300px; padding: 14px;
      background: rgba(10,10,20,0.85);
      border: 1px solid #333;
      border-radius: 8px;
      z-index: 10;
    }

    #hud {
      position: fixed; left: 12px; top: 12px; z-index: 9;
      color: #fff; font-family: monospace; background: rgba(0,0,0,0.25); padding: 6px 10px; border-radius: 6px;
      border: 1px solid #666;
    }

    canvas { display: block; }

    @media (max-width: 800px) {
      #lobby { width: calc(100% - 40px); left: 10px; right: 10px; }
      #settings { width: calc(100% - 40px); right: 10px; left: 10px; }
    }
  </style>
</head>
<body>
  <!-- Контейнер сцены -->
  <div id="sceneContainer"></div>

  <!-- Лобби UI -->
  <div id="lobby">
    <h2>Лобби</h2>
    <label>Режим матча</label>
    <select id="modeSelect">
      <option value="OneToOne">1 на 1</option>
      <option value="FFA">Каждый сам за себя (FFA)</option>
    </select>

    <div class="row" style="margin-top:10px;">
      <button id="startBtn">Начать матч</button>
    </div>

    <hr style="border:none; height:1px; background:#333; margin:12px 0;">
    <label>Друзья (локально):</label>
    <ul id="friends" style="max-height:120px; overflow:auto; padding-left:18px; margin:6px 0 6px;"></ul>
  </div>

  <!-- Настройки -->
  <div id="settings">
    <h2 style="font-size:15px; margin:0 0 8px 0;">Настройки</h2>
    <label>Чувствительность мыши: <span id="sensVal"></span></label>
    <input id="sens" type="range" min="0.5" max="4" step="0.1" value="1.0" />

    <label style="margin-top:8px;">Громкость звука: <span id="volVal"></span></label>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="1" />
  </div>

  <!-- HUD: счет и индикаторы -->
  <div id="hud" style="display:none;">
    Очки: <span id="score">0</span> | Фраги: <span id="frags">0</span> | Смерти: <span id="deaths">0</span>
  </div>

  <script>
  // Базовый автономный браузерный прототип FPS на Three.js
  // План A: локальная демо без сервера. Ввод: мышь/клавиша, режим лобби, оружие и Raycast.
  let scene, camera, renderer;
  let ground, ambient, dirLight;
  let player, weapon;
  let bots = [];
  let clock = new THREE.Clock();
  let keyState = {};

  // Управление камерой (мышь)
  let yaw = 0;
  let pitch = 0;
  let sensitivity = 1.0;

  // Raycast
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  // Лобби/UI
  const modeSelect = document.getElementById('modeSelect');
  const startBtn = document.getElementById('startBtn');
  const scoreEl = document.getElementById('score');
  const hud = document.getElementById('hud');
  const sensSlider = document.getElementById('sens');
  const volSlider = document.getElementById('vol');
  const sensVal = document.getElementById('sensVal');
  const volVal = document.getElementById('volVal');
  const friendsList = document.getElementById('friends');
  const settingsDiv = document.getElementById('settings');

  // Настройки по памяти
  function loadSettings(){
    const s = localStorage.getItem('fps_sens');
    if (s) sensitivity = parseFloat(s);
    const v = localStorage.getItem('fps_vol');
    if (v) {
      volSlider.value = v;
      // здесь можно регулировать реальный аудио контекст
    }
    sensSlider.value = sensitivity;
    sensVal.textContent = sensitivity.toFixed(2);
    volVal.textContent = (parseFloat(volSlider.value)).toFixed(2);
  }
  function saveSettings(){
    localStorage.setItem('fps_sens', sensitivity);
    localStorage.setItem('fps_vol', volSlider.value);
  }

  // Инициализация сцены
  function initScene(){
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202025);

    camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);

    renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('sceneContainer').appendChild(renderer.domElement);

    // Освещение
    ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);
    dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // Пол и стены
    const floorGeometry = new THREE.PlaneGeometry(100, 100);
    const floorMaterial = new THREE.MeshStandardMaterial({color: 0x2b2b2b});
    ground = new THREE.Mesh(floorGeometry, floorMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    scene.add(ground);

    // Граница (рамка)
    const grid = new THREE.GridHelper(100, 40, 0x444444, 0x444444);
    scene.add(grid);

    // Игрок — невидимый цилиндр/коробка как "касса" на земле (для позиционирования)
    player = new THREE.Object3D();
    player.position.set(0, 1.6, 0);
    scene.add(player);

    // Оружие — простой цилиндр/бокс, привязанный к камере
    const gunGeo = new THREE.BoxGeometry(0.3, 0.15, 1);
    const gunMat = new THREE.MeshStandardMaterial({color: 0x555555});
    const gun = new THREE.Mesh(gunGeo, gunMat);
    gun.name = 'gun';
    gun.position.set(0.4, -0.1, -0.6);
    camera.add(gun);
    weapon = gun; // держим ссылку, но камера будет в позиции игрока
  }

  // Управление клавишами
  function bindKeys(){
    window.addEventListener('keydown', (e) => { keyState[e.code] = true; }, false);
    window.addEventListener('keyup', (e) => { keyState[e.code] = false; }, false);
  }

  // Управление мышью (пойнтер-лока)
  let isPointerLocked = false;
  function setupPointerLock(){
    const canvas = renderer.domElement;
    canvas.addEventListener('click', () => {
      canvas.requestPointerLock();
    }, false);

    document.addEventListener('pointerlockchange', () => {
      isPointerLocked = document.pointerLockElement === canvas;
      if (isPointerLocked) {
        // скрыть курсор
      }
    }, false);

    document.addEventListener('mousemove', (e) => {
      if (!isPointerLocked) return;
      yaw -= e.movementX * 0.002 * sensitivity;
      pitch -= e.movementY * 0.002 * sensitivity;
      pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
      // вращаем камеру вокруг себя
      camera.rotation.x = pitch;
      // yaw на уровне родительского объекта
      player.rotation.y = yaw;
    }, false);
  }

  // Спавны
  const spawnPoints = [
    new THREE.Vector3( -10, 0, -10 ),
    new THREE.Vector3( 10, 0, -10 ),
    new THREE.Vector3( -10, 0, 10 ),
    new THREE.Vector3( 10, 0, 10 )
  ];

  // Игроки-боты (простые меши)
  function createBot(pos, color=0xff0000){
    const botG = new THREE.BoxGeometry(1, 1, 1.5);
    const botM = new THREE.MeshStandardMaterial({color: color});
    const bot = new THREE.Mesh(botG, botM);
    bot.position.copy(pos);
    bot.userData = { type: 'bot', health: 100, alive: true };
    scene.add(bot);
    bots.push(bot);
    return bot;
  }

  // Стрельба
  function shoot(){
    // muzzle position идёт от камеры (weapon.position + camera.direction)
    const origin = new THREE.Vector3();
    origin.copy(camera.position);
    // направление вперёд камеры
    const dir = new THREE.Vector3(0, 0, -1);
    dir.applyQuaternion(camera.quaternion);
    dir.normalize();

    raycaster.set(origin, dir);
    const hits = raycaster.intersectObjects(bots, true);
    if (hits.length > 0){
      const hit = hits[0].object;
      // уменьшаем здоровье бота
      if (hit.userData && hit.userData.health !== undefined){
        hit.userData.health -= 25;
        if (hit.userData.health <= 0){
          // удаляем бота и засчитываем очко
          scene.remove(hit);
          bots = bots.filter(b => b !== hit);
          // просто инкремент счета игрока
          scoreEl.dataset.kills = (Number(scoreEl.dataset.kills || 0) + 1);
          updateScoreUI();
        }
      }
    } else {
      // можно добавить эффект попадания по атмосфере
    }

    // простая вспышка Médio
    flashMuzzle();
  }

  function flashMuzzle(){
    // быстрый белый флэш у дула
    const flash = new THREE.Mesh(
      new THREE.SphereGeometry(0.08, 8, 8),
      new THREE.MeshBasicMaterial({color: 0xffffff})
    );
    flash.position.copy(weapon.getWorldPosition(new THREE.Vector3()));
    flash.position.add(camera.getWorldDirection(new THREE.Vector3()).clone().multiplyScalar(0.8));
    scene.add(flash);
    const t = gsap.to ? gsap.to(flash.scale, {x:2, y:2, z:2, duration:0.06}) : null;
    setTimeout(()=> scene.remove(flash), 60);
  }

  // Инициализация сцены и старт матча
  let gameStarted = false;
  let gsapLoaded = false;
  function startMatch(){
    // очистить старые объекты
    bots.forEach(b => scene.remove(b));
    bots = [];

    // Загрузить пары ботов в режим 1v1 или FFA
    const mode = modeSelect.value;
    if (mode === 'OneToOne'){
      // 1v1: один бот
      createBot(spawnPoints[2], 0xff4444);
    } else {
      // FFA: несколько ботов
      createBot(spawnPoints[0], 0xff4444);
      createBot(spawnPoints[1], 0x44ff44);
      createBot(spawnPoints[3], 0x4444ff);
    }

    // начальные позиции игрока
    const startPos = spawnPoints[0].clone();
    player.position.set(startPos.x, startPos.y + 0.1, startPos.z);
    camera.position.set(0, 0, 0);
    yaw = 0; pitch = 0;

    hud.style.display = 'block';
    scoreEl.textContent = 0;
    hud.style.display = 'block';
    gameStarted = true;
  }

  function updateScoreUI(){
    const kills = Number(scoreEl.dataset.kills || 0);
    scoreEl.textContent = hitsToScore(kills);
  }
  function hitsToScore(n){ return n; }

  // Основной цикл
  function animate(){
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    if (!gameStarted) return renderer.render(scene, camera);

    // Простая физика ходьбы игрока
    const speed = 5;
    const forward = new THREE.Vector3();
    camera.getWorldDirection(forward);
    forward.y = 0;
    forward.normalize();
    const right = new THREE.Vector3();
    right.crossVectors(new THREE.Vector3(0,1,0), forward);

    let moveDir = new THREE.Vector3(0,0,0);
    if (keyState['KeyW']) moveDir.add(forward);
    if (keyState['KeyS']) moveDir.sub(forward);
    if (keyState['KeyA']) moveDir.sub(right);
    if (keyState['KeyD']) moveDir.add(right);
    moveDir.normalize();
    player.position.add(moveDir.multiplyScalar(speed * dt));
    // camera/scene follow
    camera.position.set(0, 0, 0);

    // bots: простая AI-логика перемещения к рандомной точке
    bots.forEach((b) => {
      if (!b.userData.alive && b.parent) return;
      const t = Date.now() * 0.001;
      // простой паттерн: медленно плыть по сцене
      b.position.x += Math.sin(t + b.id) * 0.01;
      b.position.z += Math.cos(t + b.id) * 0.01;
      // простая атака по игроку
    });

    renderer.render(scene, camera);
  }

  // Вычисление инициализации
  function init(){
    // Лобби/настройки
    loadSettings();
    // Сцена
    initScene();
    bindKeys();
    setupPointerLock();
    // добавим обработчик стрелялки
    window.addEventListener('mousedown', (e) => {
      if (isPointerLocked) shoot();
    });

    // Начало игры
    startBtn.addEventListener('click', () => {
      // запускаем матч
      startMatch();
      // показываем HUD
    });

    // Подсветка сенситивити/vol
    sensSlider.addEventListener('input', () => {
      sensitivity = parseFloat(sensSlider.value);
      sensVal.textContent = sensitivity.toFixed(2);
      saveSettings();
    });
    volSlider.addEventListener('input', () => {
      volVal.textContent = parseFloat(volSlider.value).toFixed(2);
      saveSettings();
    });

    // Демонстрация друзей (локально)
    addFriend('Alex');
    addFriend('Nika');
  }

  function addFriend(nick){
    const li = document.createElement('li');
    li.textContent = nick;
    friendsList.appendChild(li);
  }

  // Пуск
  init();
  animate();

  // Адаптация под изменение размера окна
  window.addEventListener('resize', () => {
    if (!renderer) return;
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // Приведём к стартапу: начни смотреть в браузере.
  </script>
</body>
</html>

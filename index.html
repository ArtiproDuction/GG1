<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Unified FPS — Браузерный прототип</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body, html { margin: 0; height: 100%; background: #000; color: #fff; font-family: sans-serif; }
    #scene { width: 100%; height: 100vh; display: block; }
    #hud { position: fixed; top: 10px; left: 10px; padding: 8px 12px; background: rgba(0,0,0,.5); border-radius: 6px; z-index: 10; }
    #reticle { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 16px; height: 16px; pointer-events: none; z-index: 999; }
    #reticle:before, #reticle:after { content: ''; position: absolute; width: 2px; height: 16px; background: #fff; left: 50%; top: 0; transform: translateX(-50%); }
    #reticle:after { transform: rotate(90deg); }
    .panel { position: fixed; left: 10px; bottom: 10px; padding: 8px; background: rgba(0,0,0,.5); border-radius: 6px; }
    #epicLobby { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: none; z-index: 1000; }
    #epicLobby .bg { position: absolute; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(20,40,100,.3), rgba(0,0,0,.8)); animation: drift 30s linear infinite; }
    @keyframes drift { from { background-position: 0 0; } to { background-position: 1000px 600px; } }
    #epicLobby .card { position: absolute; left: 5%; top: 8%; width: 90%; max-width: 1100px; height: auto; min-height: 420px; padding: 20px; border-radius: 16px; display: grid; grid-template-columns: 1fr 360px; gap: 20px; background: rgba(0,0,0,.4); color:#fff; }
    #epicLobby .logo { font-size: 28px; font-weight: bold; margin-bottom: 10px; }
    #epicLobby .players { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; align-content: start; padding: 8px; max-height: 260px; overflow: auto; }
    .playerCard { display: flex; align-items: center; padding: 8px; background: rgba(0,0,0,.25); border-radius: 8px; border: 1px solid rgba(255,255,255,.15); }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #888; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; margin-right: 8px; }
    .status { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-left: auto; }
    .ready { background: #4ade80; }
    .notready { background: #f87171; }
    #epicLobby .panelActions { display: flex; flex-direction: column; gap: 8px; padding: 8px; }
    #epicLobby button { padding: 10px 14px; border-radius: 8px; border: none; background: #1e3a8a; color: #fff; cursor: pointer; font-weight: bold; }
    #epicLobby select, #epicLobby input, #epicLobby button { font-family: inherit; }
  </style>
</head>
<body>
  <div id="hud">HP: <span id="playerHP">100</span> | Очки: <span id="score">0</span></div>
  <div id="reticle"></div>
  <canvas id="scene"></canvas>

  <!-- Invite panel -->
  <div class="panel" style="left:10px; bottom: 120px;">
    <label>Invite by ID</label><input id="inviteId" type="text" placeholder="Friend ID" style="width:180px;"/><br/>
    <button id="copyInviteBtn" style="margin-top:6px;">Copy Invite Link</button>
  </div>

  <!-- Settings & control panel -->
  <div class="panel" style="left:10px; bottom: 60px;">
    Чувствительность: <span id="sensVal">1.0</span><br/>
    <input id="sens" type="range" min="0.5" max="4" step="0.1" value="1">
  </div>

  <!-- Epic lobby (красивый режим лобби) -->
  <div id="epicLobby">
    <div class="bg"></div>
    <div class="card">
      <div>
        <div class="logo">UNIFIED FPS ARENA</div>
        <div class="players" id="lobbyLeft" style="grid-template-columns: repeat(auto-fill, minmax(120px,1fr));"></div>
      </div>
      <div class="panelActions" id="lobbyRight">
        <label>Режим</label>
        <select id="epicMode">
          <option value="coop">Coop</option>
          <option value="versus">Versus</option>
          <option value="training">Training</option>
        </select>

        <!-- Team selection -->
        <label>Команда</label>
        <select id="epicTeam">
          <option value="0">Special Forces</option>
          <option value="1">Terrorists</option>
        </select>

        <!-- Training specifics -->
        <div id="epicTraining" style="display:none;">
          <label>Сложность ботов</label>
          <select id="epicTrainingDiff">
            <option value="0">Easy</option>
            <option value="1">Medium</option>
            <option value="2">Hard</option>
          </select>
          <button id="epicTrainingStart" style="margin-top:6px;">Start Training</button>
        </div>

        <button id="epicStart" style="margin-top:8px;">Start Match</button>
        <button id="epicShare" style="margin-top:6px;">Copy Invite Link</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/three@0.152.0/build/three.min.js"></script>
  <script>
    // Global variables
    let scene, camera, renderer;
    let player, ground;
    let keys = {};
    let score = 0;
    let enemies = [];

    let standingY = 1.8, crouchY = 1.0;
    let raycaster = new THREE.Raycaster();

    let weaponGroup;
    let isInspecting = false;
    let recoil = 0;
    const standingPose = { pos: new THREE.Vector3(0.6, -0.15, -0.8), rotX: 0 };
    const inspectPose  = { pos: new THREE.Vector3(0.0, -0.18, -0.4), rotX: -0.6 };

    const clock = new THREE.Clock();
    // Zoom & ID
    let baseFov = 75;
    let zoomFov = 56.25;
    let isZooming = false;
    let userId = localStorage.getItem('fps_user_id');
    if (!userId) { userId = 'ID-' + Math.random().toString(36).slice(2,6) + '-' + Date.now().toString(36); localStorage.setItem('fps_user_id', userId); }

    // Training bot state
    let trainingBots = [];
    let trainingActive = false;
    let playerHP = 100;
    let playerTeam = 0; // 0 SF by default

    // Init scene (Three.js)
    function init(){
      const canvas = document.getElementById('scene');
      renderer = new THREE.WebGLRenderer({canvas, antialias: true});
      resize();
      window.addEventListener('resize', resize);
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x111522);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      player = new THREE.Object3D();
      scene.add(player);
      player.add(camera);
      camera.position.y = standingY;

      // ground & walls
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({color:0x2a2a2a}));
      floor.rotation.x = -Math.PI/2; scene.add(floor);
      const wall1 = new THREE.Mesh(new THREE.BoxGeometry(60, 6, 0.5), new THREE.MeshStandardMaterial({color:0x444444})); wall1.position.set(0,3,-30); scene.add(wall1);
      const wall2 = wall1.clone(); wall2.position.set(-30,3,0); wall2.rotation.y = Math.PI/2; scene.add(wall2);

      // weapon (realistic look)
      weaponGroup = new THREE.Group(); camera.add(weaponGroup);
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.25,0.25), new THREE.MeshStandardMaterial({color:0x555555}));
      body.position.set(0.0, -0.2, -0.35);
      const barrel = new THREE.Mesh(new THREE.BoxGeometry(1.0,0.15,0.5), new THREE.MeshStandardMaterial({color:0x333333}));
      barrel.position.set(0.65, -0.2, -0.6);
      const mag = new THREE.Mesh(new THREE.BoxGeometry(0.25,0.4,0.25), new THREE.MeshStandardMaterial({color:0x444444}));
      mag.position.set(-0.25, -0.05, -0.23);
      const grip = new THREE.Mesh(new THREE.BoxGeometry(0.25,0.5,0.25), new THREE.MeshStandardMaterial({color:0x666666}));
      grip.position.set(-0.6, -0.05, -0.15);
      weaponGroup.add(body, barrel, mag, grip);
      weaponGroup.position.set(0.6, -0.15, -0.8);

      // bots (for training) - if training mode is activated, bots will be shown
      // Build basic bots only when training starts

      // lights
      const al = new THREE.AmbientLight(0xffffff,0.6); scene.add(al);
      const dl = new THREE.DirectionalLight(0xffffff,0.8); dl.position.set(5,10,7); scene.add(dl);

      // pointer lock
      document.body.addEventListener('click', ()=>{ renderer.domElement.requestPointerLock(); }, false);
      document.addEventListener('pointerlockchange', ()=>{}, false);

      // controls
      window.addEventListener('keydown', (e)=>{ keys[e.code] = true; if(e.code==='KeyI'){ isInspecting = !isInspecting; } }, false);
      window.addEventListener('keyup', (e)=>{ keys[e.code] = false; }, false);

      // mouse look
      let yaw=0, pitch=0;
      document.addEventListener('mousemove', (e)=>{
        if (document.pointerLockElement !== renderer.domElement) return;
        yaw -= e.movementX * 0.0025;
        pitch -= e.movementY * 0.0025;
        pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
        player.rotation.y = yaw;
        camera.rotation.x = pitch;
      });

      // right-click zoom
      document.addEventListener('contextmenu', (e)=>{ e.preventDefault(); isZooming = true; });
      document.addEventListener('mousedown', (e)=>{ if (e.button===2) isZooming = true; }, false);
      document.addEventListener('mouseup', (e)=>{ if (e.button===2) isZooming = false; }, false);

      // settings
      document.getElementById('sens').addEventListener('input', (ev)=>{ document.getElementById('sensVal').textContent = ev.target.value; });
      document.getElementById('sens').value = 1; document.getElementById('sensVal').textContent = '1.0';
      document.getElementById('sens').addEventListener('change', ()=>{ localStorage.setItem('fps_sens', document.getElementById('sens').value); });

      // Training UI actions
      const epicMode = document.getElementById('epicMode');
      const epicTraining = document.getElementById('epicTraining');
      if (epicMode){ epicMode.addEventListener('change', ()=>{ 
        const m = epicMode.value;
        document.getElementById('epicTraining').style.display = (m==='training')? 'block' : 'none';
      }); }

      const epicTrainingDiff = document.getElementById('epicTrainingDiff');
      document.getElementById('epicTrainingStart')?.addEventListener('click', ()=> {
        if (epicTrainingDiff){
          const diff = Number(epicTrainingDiff.value) || 0;
          // simple client-side training start
          startTraining(diff);
        }
      });

      // Start match (coop/versus)
      document.getElementById('epicStart').addEventListener('click', ()=> {
        // If mode is training, training will be started via separate button
        // For now just reset world
        stopTraining();
      });

      // Copy invite link
      document.getElementById('epicShare').addEventListener('click', ()=> {
        const link = location.origin + location.pathname + '?player=' + encodeURIComponent(userId);
        navigator.clipboard.writeText(link);
      });

      // Invite link copy
      document.getElementById('copyInviteBtn').addEventListener('click', ()=> {
        const id = document.getElementById('inviteId').value || userId;
        const link = location.origin + location.pathname + '?player=' + encodeURIComponent(id);
        navigator.clipboard.writeText(link);
      });
    }

    function resize(){ if (renderer) { const w=window.innerWidth, h=window.innerHeight; renderer.setSize(w,h); camera.aspect = w/h; camera.updateProjectionMatrix(); } }

    // Simple training logic (client-side)
    function startTraining(diff){
      // diff: 0 Easy, 1 Medium, 2 Hard
      trainingActive = true;
      playerHP = 100;
      updateHud();
      // spawn bots if not exists
      spawnBotModelForTraining( diff );
    }

    function stopTraining(){
      trainingActive = false;
      // remove bots
      trainingBots.forEach(b=> scene.remove(b));
      trainingBots.length = 0;
    }

    // Create a basic bot model (utility)
    function spawnBotModelForTraining(diff){
      // ensure any existing bots cleared
      trainingBots.forEach(b=> scene.remove(b));
      trainingBots.length = 0;
      const colors = [0xff5555, 0x55ff55, 0x5555ff];
      const pts = [ new THREE.Vector3(-6,0,-6), new THREE.Vector3(6,0,-6), new THREE.Vector3(0,0,6) ];
      // simple model: color by difficulty
      for (let i=0; i<pts.length; i++){
        const bot = createCharacterModel(0);
        bot.position.copy(pts[i]);
        bot.userData = {
          hp: diff===0?60: diff===1?100:150,
          speed: diff===0?1.4: diff===1?2.0:3.0,
          alive:true,
          team: 0
        };
        const mat = new THREE.MeshStandardMaterial({ color: colors[diff] });
        bot.traverse((child) => {
          if (child.isMesh) child.material = mat;
        });
        scene.add(bot);
        trainingBots.push(bot);
      }
    }

    // Create SF/TS model helper (used for bots and players)
    function createCharacterModel(team){
      const group = new THREE.Group();
      const colorA = team === 0 ? 0x2b6bd3 : 0x8b0000;
      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.0, 0.32), new THREE.MeshStandardMaterial({ color: colorA })); torso.position.y = 0.5; group.add(torso);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 8), new THREE.MeshStandardMaterial({ color: 0xffe0c8 })); head.position.y = 1.15; group.add(head);
      const helmet = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.25, 0.75), new THREE.MeshStandardMaterial({ color: 0x111111 })); helmet.position.y = 1.38; group.add(helmet);

      const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,0.8), new THREE.MeshStandardMaterial({ color: colorA })); armL.rotation.z = Math.PI/2; armL.position.set(-0.65,0.75,0);
      const armR = armL.clone(); armR.position.x = 0.65;
      const legL = new THREE.Mesh(new THREE.BoxGeometry(0.25,0.9,0.25), new THREE.MeshStandardMaterial({ color: 0x333333 })); legL.position.set(-0.18,-0.05,0);
      const legR = legL.clone(); legR.position.x = 0.18;

      group.add(armL, armR, legL, legR);
      group.userData = { team };
      return group;
    }

    // Bot AI & training update
    function updateTraining(dt){
      if (!trainingActive) return;
      // move bots towards player
      const playerPos = new THREE.Vector3();
      camera.getWorldPosition(playerPos);
      trainingBots.forEach(bot => {
        if (!bot.userData.alive) return;
        const dir = new THREE.Vector3().subVectors(playerPos, bot.position).normalize();
        bot.position.add(dir.multiplyScalar(bot.userData.speed * dt));
        // bot shooting if close
        if (bot.position.distanceTo(playerPos) < 6){
          playerHP -= (dt * (Math.random()*2 + 1) ); // простой урон
          if (playerHP <= 0){
            playerHP = 0; trainingActive = false; alert('Training Over: You died!');
          }
          updateHud();
        }
      });
    }

    function updateHud(){
      const scoreEl = document.getElementById('score');
      document.getElementById('playerHP').textContent = Math.floor(playerHP);
      if (scoreEl) scoreEl.textContent = score;
    }

    // Core loop (two modes)
    function coreLoop(){
      const dt = clock.getDelta();
      update(dt);
      updateTraining(dt);
      requestAnimationFrame(coreLoop);
    }

    // Start the program
    // We'll auto-start a simple scene with weapons
    </script>
  <script src="https://unpkg.com/three@0.152.0/build/three.min.js"></script>
  <script>
    // простые каркасные вызовы для запуска
  </script>
  </body>
</html>

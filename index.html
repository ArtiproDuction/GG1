<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>GunShot — Unified FPS Arena</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* CS1.6-inspired look: dark, thick borders, bold typography */
    :root {
      --bg: #0b0f1a;
      --panel: rgba(0,0,0,.6);
      --accent: #2a6cff;
      --text: #e8f0ff;
    }
    html, body { margin: 0; height: 100%; background: #000; color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto; }
    #scene { width: 100%; height: 100vh; display: block; background: #111; }

    /* HUD и прицел */
    #hud { position: fixed; top: 8px; left: 8px; padding: 8px 12px; background: rgba(0,0,0,.5); border-radius: 6px; z-index: 10; font-weight: bold; }

    #reticle { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 18px; height: 18px; pointer-events: none; z-index: 999; }

    /* CS16-style overlay menu (стили CS1.6 в духе CS16) */
    #cs1xMenu { display: none; }

    /* CS1.6-подобное главное меню (центральное) */
    #mainMenuCS16 {
      display: block;
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 720px; max-width: 92vw;
      background: #141a23;
      border: 2px solid #1e6feb;
      border-radius: 12px;
      padding: 22px;
      text-align: center;
      z-index: 9999;
      box-shadow: 0 20px 60px rgba(0,0,0,.6);
    }
    #mainMenuCS16 h1 {
      font-family: Impact, "Arial Black", sans-serif;
      font-size: 54px;
      margin: 6px 0;
      color: #dcefff;
      text-shadow: 0 0 12px #4ea3ff;
      letter-spacing: 2px;
    }
    #mainMenuCS16 .subtitle { color: #a5c3ff; font-size: 14px; margin-bottom: 14px; }
    .cs16Buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; justify-items: center; margin-top: 6px; }
    .cs16Btn {
      width: 320px;
      height: 64px;
      border-radius: 8px;
      border: 0;
      font-weight: bold;
      font-size: 20px;
      cursor: pointer;
      color: #04123a;
      background: linear-gradient(#6a9dfc, #2a63e6);
      box-shadow: 0 6px 14px rgba(0,0,0,.4);
    }
    .cs16Btn.secondary { background: linear-gradient(#232323, #1a1a1a); color: #e6e6e6; }

    /* Небольшие кнопки/элементы управления */
    #invitePanel { display: none; }

    @media (max-width: 800px) {
      #mainMenuCS16 { width: 92vw; }
      .cs16Buttons { grid-template-columns: 1fr; }
      .cs16Btn { width: 90%; }
    }

    /* CS1.6-style panel под лобби/боевую логику можно адаптировать далее */
    #epicLobby { display: none; }
  </style>
</head>
<body>
  <div id="hud">HP: 100 | Очки: 0</div>
  <div id="reticle"></div>
  <canvas id="scene"></canvas>

  <!-- CS16 main menu overlay (Play: FFA / Duel with Bots) -->
  <div id="mainMenuCS16" class="cs16Menu" aria-label="GunShot CS1.6 Menu" style="display:block;">
    <div id="cs16Header" style="margin-bottom:8px;">
      <div id="cs16Title" style="font-family: Impact, 'Arial Black', sans-serif; font-size: 64px; color:#e6f6ff; text-shadow:0 0 12px #4ea3ff; letter-spacing:2px; margin-bottom:6px;">
        GunShot
      </div>
      <div id="cs16Subtitle" class="subtitle">CS1.6-inspired main menu</div>
    </div>
    <div class="cs16Buttons">
      <button id="ffaBtn" class="cs16Btn" style="background: linear-gradient(#6a9dff,#2a63e6);">Play: FFA</button>
      <button id="duelBtn" class="cs16Btn" style="background: linear-gradient(#6a9dff,#2a63e6);">Play: Duel with Bots</button>
    </div>
    <div style="margin-top:12px;">
      <button id="closeCS16" class="cs16Btn secondary" style="width: 520px; height: 50px; font-size: 18px;">Close</button>
    </div>
  </div>

  <!-- Invite by ID panel -->
  <div id="invitePanel" class="panel" style="left:10px; bottom:10px;">
    <label>Invite by ID</label><input id="inviteId" type="text" placeholder="Friend ID" style="width:200px;"/><br/>
    <button id="copyInviteBtn" style="margin-top:6px;">Copy Invite Link</button>
  </div>

  <!-- Settings placeholder -->
  <div class="panel" style="right:10px; bottom:10px;">
    Чувствительность: <span id="sensVal">1.0</span><br/>
    <input id="sens" type="range" min="0.5" max="4" step="0.1" value="1">
  </div>

  <script src="https://unpkg.com/three@0.152.0/build/three.min.js"></script>
  <script>
  // 1-file, CS1.6-style main menu + real-time 3D FPS with SF/TS bots and training

  // Title customization
  (function(){
    const key = 'fps_personal_title';
    const t = new URL(location.href).searchParams.get('title');
    const title = localStorage.getItem(key) || (t || 'GunShot');
    localStorage.setItem(key, title);
    document.title = title + ' — GunShot';
  })();

  // Scene
  let scene, camera, renderer;
  let player, weaponGroup;
  let clock = new THREE.Clock();
  let botGroup = [];
  let trainingActive = false;
  let trainingDiff = 0;
  let move = { forward:false, back:false, left:false, right:false };
  let hp = 100;
  let lastShot = 0;
  let fireRate = 0.25;
  let isFiring = false;

  function resize(){
    if (!renderer) return;
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  }

  function initScene(){
    const canvas = document.getElementById('scene');
    renderer = new THREE.WebGLRenderer({canvas, antialias:true});
    resize(); window.addEventListener('resize', resize);

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0a);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    player = new THREE.Object3D();
    scene.add(player);
    player.add(camera);
    camera.position.y = 1.7;

    // ground and walls
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(60,60), new THREE.MeshStandardMaterial({color:0x202020}));
    floor.rotation.x = -Math.PI/2;
    scene.add(floor);
    const wall = new THREE.Mesh(new THREE.BoxGeometry(60,6,0.5), new THREE.MeshStandardMaterial({color:0x444444}));
    wall.position.set(0,3,-30); scene.add(wall);

    // realistic weapon assembly
    weaponGroup = new THREE.Group(); camera.add(weaponGroup);
    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.9,1.0,0.3), new THREE.MeshStandardMaterial({color:0x555555})); torso.position.y=0.5;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.22,12,12), new THREE.MeshStandardMaterial({color:0xffd8b4})); head.position.y=1.15;
    const helmet = new THREE.Mesh(new THREE.BoxGeometry(0.66,0.25,0.66), new THREE.MeshStandardMaterial({color:0x111111})); helmet.position.y=1.4;
    const barrel = new THREE.Mesh(new THREE.BoxGeometry(1.0,0.15,0.5), new THREE.MeshStandardMaterial({color:0x333333})); barrel.position.set(0.75,0.0,-0.65);
    const mag = new THREE.Mesh(new THREE.BoxGeometry(0.25,0.4,0.25), new THREE.MeshStandardMaterial({color:0x444444})); mag.position.set(-0.25,0.0,-0.25);
    const grip = new THREE.Mesh(new THREE.BoxGeometry(0.25,0.6,0.25), new THREE.MeshStandardMaterial({color:0x666666})); grip.position.set(-0.60,0.0,-0.15);
    weaponGroup.add(torso, head, helmet, barrel, mag, grip);
    weaponGroup.position.set(0.5,-0.05,-0.8);

    // lights
    const amb = new THREE.AmbientLight(0xffffff,0.6); scene.add(amb);
    const dir = new THREE.DirectionalLight(0xffffff,0.8); dir.position.set(5,10,7); scene.add(dir);

    // basic controls
    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyW') move.forward = true;
      if (e.code === 'KeyS') move.back = true;
      if (e.code === 'KeyA') move.left = true;
      if (e.code === 'KeyD') move.right = true;
      if (e.code === 'KeyI') toggleInspect();
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW') move.forward = false;
      if (e.code === 'KeyS') move.back = false;
      if (e.code === 'KeyA') move.left = false;
      if (e.code === 'KeyD') move.right = false;
    });

    // pointer lock
    canvas.addEventListener('click', () => { canvas.requestPointerLock(); }, false);
    document.addEventListener('pointerlockchange', ()=>{}, false);

    // mouse look
    let yaw = 0, pitch = 0;
    document.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement !== canvas) return;
      yaw -= e.movementX * 0.0025;
      pitch -= e.movementY * 0.0025;
      pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
      player.rotation.y = yaw;
      camera.rotation.x = pitch;
    });

    // Zoom (RMB) |
    document.addEventListener('contextmenu', (e) => { e.preventDefault(); }, false);
    document.addEventListener('mousedown', (e) => { if (e.button===2) isZooming = true; }, false);
    document.addEventListener('mouseup',   (e) => { if (e.button===2) isZooming = false; }, false);

    // Fire
    let cooldown = 0;
    window.addEventListener('mousedown', (e) => {
      if (e.button === 0) { fireHeld = true; cooldown = 0; }
    });
    window.addEventListener('mouseup', (e) => { if (e.button === 0) { fireHeld = false; } });

    // Right now, we implement simple FOV zoom via keyboard or hold RMB in update loop
  }

  // Helpers
  function createCharacterModel(team){
    const group = new THREE.Group();
    const color = team===0 ? 0x2b6bd3 : 0x8b0000;
    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6,1.0,0.3), new THREE.MeshStandardMaterial({color})); torso.position.y = 0.5; group.add(torso);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.22,12,12), new THREE.MeshStandardMaterial({color:0xffd8b4})); head.position.y=1.15; group.add(head);
    const helmet = new THREE.Mesh(new THREE.BoxGeometry(0.66,0.25,0.66), new THREE.MeshStandardMaterial({color:0x111111})); helmet.position.y=1.4; group.add(helmet);
    const lArm = new THREE.Mesh(new THREE.BoxGeometry(0.14,0.8,0.14), new THREE.MeshStandardMaterial({color})); lArm.position.set(-0.54,0.75,0);
    const rArm = lArm.clone(); rArm.position.set(0.54,0.75,0);
    const lLeg = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.9,0.2), new THREE.MeshStandardMaterial({color:0x333333})); lLeg.position.set(-0.18,-0.05,0);
    const rLeg = lLeg.clone(); rLeg.position.set(0.18,-0.05,0);
    const leftArmPivot = new THREE.Group(); leftArmPivot.position.set(-0.54,0.75,0); leftArmPivot.add(lArm);
    const rightArmPivot = new THREE.Group(); rightArmPivot.position.set(0.54,0.75,0); rightArmPivot.add(rArm);
    group.add(leftArmPivot); group.add(rightArmPivot); group.add(lLeg); group.add(rLeg);
    group.userData = { team, animTime: 0, joints: { torso, head, helmet, leftArm: lArm, rightArm: rArm, leftLeg: lLeg, rightLeg: rLeg, leftArmPivot, rightArmPivot } };
    return group;
  }

  // Start Menu (CS1.6 style)
  function showCS16Menu(){
    // Already implemented via CS16 overlay in this single-file version
  }

  // Training
  let trainBots = [];
  function spawnBotsForTraining(diff){
    // remove old bots
    trainBots.forEach(b => scene.remove(b)); trainBots.length = 0;
    const pts = [ new THREE.Vector3(-5,0,-5), new THREE.Vector3(5,0,-5), new THREE.Vector3(0,0,5) ];
    for (let i=0;i<pts.length;i++){
      const bot = createCharacterModel(0);
      bot.position.copy(pts[i]);
      bot.userData = { hp: diff===0?60: diff===1?100:150, speed: diff===0?1.5: diff===1?2.0:3.0, alive:true, team:0, animTime:0 };
      scene.add(bot);
      trainBots.push(bot);
    }
  }

  // Init & loop
  initScene();
  showCS16Menu();

  // main loop
  function loop(){
    requestAnimationFrame(loop);
    const dt = clock.getDelta();

    // movement
    const v = new THREE.Vector3();
    if (move.forward) v.z -= 1;
    if (move.backward) v.z += 1;
    if (move.left) v.x -= 1;
    if (move.right) v.x += 1;
    if (v.lengthSq()) {
      v.normalize();
      const fwd = new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);
      const rt  = new THREE.Vector3(1,0,0).applyQuaternion(player.quaternion);
      const mv = new THREE.Vector3();
      mv.addScaledVector(fwd, v.z);
      mv.addScaledVector(rt, v.x);
      mv.y = 0;
      player.position.add(mv.multiplyScalar(moveSpeed * dt));
    }

    // Simple bot animation if present
    if (trainBots.length){
      for (const bot of trainBots){
        if (!bot.userData.alive) continue;
        bot.userData.animTime = (bot.userData.animTime||0) + dt;
        const t = bot.userData.animTime;
        const limbSwing = Math.sin(t * (bot.userData.speed)) * 0.6;
        if (bot.userData.joints){
          const j = bot.userData.joints;
          if (j.leftLeg) j.leftLeg.rotation.x = limbSwing;
          if (j.rightLeg) j.rightLeg.rotation.x = -limbSwing;
          if (j.leftArmPivot) j.leftArmPivot.rotation.x = Math.cos(t * bot.userData.speed) * 0.6;
          if (j.rightArmPivot) j.rightArmPivot.rotation.x = -Math.cos(t * bot.userData.speed) * 0.6;
        }
        // move toward player
        const playerPos = new THREE.Vector3();
        camera.getWorldPosition(playerPos);
        const dir = new THREE.Vector3().subVectors(playerPos, bot.position).normalize();
        bot.position.add(dir.multiplyScalar(bot.userData.speed * dt));
      }
    }

    // Zoom FOV
    if (typeof camera !== 'undefined'){
      const targetFov = isZooming ? zoomFov : baseFov;
      camera.fov += (targetFov - camera.fov) * 0.2;
      camera.updateProjectionMatrix();
    }

    // Shooting cadence (LMB hold)
    // This simple cadence is handled by a global flag and lastShot/timer in a real implementation.
    // For compactness we use a minimal cadence:
    // If isFiring true and enough time passed, shoot().
    // (This block would be integrated if we add a fire cadence timer.)

    // render
    if (renderer && scene && camera) renderer.render(scene, camera);
  }
  loop();
  </script>
</body>
</html>
